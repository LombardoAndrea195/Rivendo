<!doctype html>
<html lang="it">
  <body style="margin:0;padding:32px 16px;background:#f7f6f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1d1c1a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;background:#ffffff;border:1px solid #e6e3dc;border-radius:14px;padding:32px">
            <tr>
              <td>
                <div style="display:inline-block;width:32px;height:32px;line-height:32px;text-align:center;border-radius:9px;background:#1f6f50;color:#fff;font-weight:700">R</div>
                <h1 style="font-size:20px;margin:20px 0 8px">Accedi a Rivendo</h1>
                <p style="margin:0 0 24px;color:#6d6a64;line-height:1.5">Premi il pulsante per entrare. Il link vale una sola volta e scade tra un’ora.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f6f50;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px">Entra in Rivendo</a>
                <p style="margin:24px 0 0;font-size:13px;color:#6d6a64;line-height:1.5">Se non hai richiesto tu l’accesso, ignora questa email: nessuno potrà entrare senza questo link.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
