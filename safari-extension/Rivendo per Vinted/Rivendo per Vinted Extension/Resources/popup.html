<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rivendo per Vinted</title>
    <style>
      body { width: 280px; margin: 0; padding: 16px; color: #1d1c1a; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 12px; color: #5f5b54; }
      button { width: 100%; border: 0; border-radius: 8px; padding: 10px 12px; background: #1f6f50; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
      #status { margin-top: 10px; min-height: 20px; font-size: 12px; }
      .error { color: #b4382f; }
    </style>
  </head>
  <body>
    <h1>Rivendo per Vinted</h1>
    <p>Apri la pagina “Vendi” di Vinted, poi premi il pulsante per compilare l’annuncio che hai appena preparato.</p>
    <button id="fill">Compila l’annuncio</button>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
